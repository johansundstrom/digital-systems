<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 07 - Radio</title>

    <script>
        function changeRed() {
            console.log('Red');
            document.body.style.backgroundColor = 'red';
        }

        function changeBlue() {
            console.log('Blue');
            document.body.style.backgroundColor = 'blue';
        }

        function changeReset() {
            console.log('White');
            document.body.style.backgroundColor = 'white';
        }
    </script>
</head>

<body>
    <a href="index.html">
        <<< Back</a>
            <hr>
            <input type="radio" onchange="changeRed()" id="red" name="color">
            <label for="red">Red</label><br>
            <input type="radio" onchange="changeBlue()" id="blue" name="color">
            <label for="blue">Blue</label><br>
            <input type="radio" onchange="changeReset()" id="white" name="color">
            <label for="white">White</label><br>
</body>

</html>
